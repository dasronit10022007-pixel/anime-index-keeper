name: Anime Index Keep Alive

on:
  schedule:
    # Runs at 00:00 UTC on the 1st and 15th of every month
    - cron: '0 0 1,15 * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  # -------------------------------------------------------------
  # JOB 1: Automatically calculate how many 500-row batches we need
  # -------------------------------------------------------------
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Supabase SDK
        run: pip install supabase

      - name: Calculate Batches from Supabase Row Count
        id: set-matrix
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python -c '
          import os, json, math
          from supabase import create_client

          url = os.environ.get("SUPABASE_URL")
          key = os.environ.get("SUPABASE_KEY")
          client = create_client(url, key)

          # Query total row count from Supabase
          res = client.table("episodes_v2").select("id", count="exact").limit(1).execute()
          total = res.count if res.count is not None else 0

          chunk_size = 500
          chunks = math.ceil(total / chunk_size) if total > 0 else 1

          # Build dynamic matrix JSON
          matrix = {"include": [{"offset": i * chunk_size, "limit": chunk_size} for i in range(chunks)]}
          print(f"Detected {total} total rows. Generated {chunks} matrix jobs.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
          '

  # -------------------------------------------------------------
  # JOB 2: Run all calculated batches in parallel
  # -------------------------------------------------------------
  ping-videos:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies for Selenium
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase selenium webdriver-manager

      - name: Run Keep Alive Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python keep_alive.py --offset ${{ matrix.offset }} --limit ${{ matrix.limit }}
