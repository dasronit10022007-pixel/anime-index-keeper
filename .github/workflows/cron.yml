name: Anime Index Keep Alive

on:
  schedule:
    - cron: '0 0 1,15 * *'
  workflow_dispatch:
    # NEW: This creates a text box on GitHub when you run it manually
    inputs:
      test_url:
        description: 'Test a single URL (Leave blank to run full database)'
        required: false
        type: string

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Supabase SDK
        run: pip install supabase

      - name: Calculate Batches or Single URL
        id: set-matrix
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          # Pass the input URL to the Python script
          TEST_URL: ${{ inputs.test_url }}
        run: |
          python -c '
          import os, json, math
          from supabase import create_client

          test_url = os.environ.get("TEST_URL")
          
          # If a user typed a test URL, only create 1 tiny job
          if test_url and test_url.strip():
              matrix = {"include": [{"offset": 0, "limit": 1, "test_url": test_url}]}
              print("Single URL test mode activated.")
          else:
              # Otherwise, do the normal full database calculation
              url = os.environ.get("SUPABASE_URL")
              key = os.environ.get("SUPABASE_KEY")
              client = create_client(url, key)
              res = client.table("episodes_v2").select("id", count="exact").limit(1).execute()
              total = res.count if res.count is not None else 0
              chunk_size = 500
              chunks = math.ceil(total / chunk_size) if total > 0 else 1
              matrix = {"include": [{"offset": i * chunk_size, "limit": chunk_size, "test_url": ""} for i in range(chunks)]}
              print(f"Detected {total} total rows. Generated {chunks} matrix jobs.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
          '

  ping-videos:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies for Selenium
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase selenium webdriver-manager

      - name: Run Keep Alive Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TEST_URL: ${{ matrix.test_url }}
        run: |
          python keep_alive.py --offset ${{ matrix.offset }} --limit ${{ matrix.limit }}
