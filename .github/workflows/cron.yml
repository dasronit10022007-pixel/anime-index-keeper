name: Anime Index Keep Alive

on:
  schedule:
    # Runs at 00:00 UTC on the 1st and 15th of every month
    - cron: '0 0 1,15 * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  ping-videos:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Define offsets for each chunk (0 to 4000 in steps of 500)
        include:
          - offset: 0
            limit: 500
          - offset: 500
            limit: 500
          - offset: 1000
            limit: 500
          - offset: 1500
            limit: 500
          - offset: 2000
            limit: 500
          - offset: 2500
            limit: 500
          - offset: 3000
            limit: 500
          - offset: 3500
            limit: 500

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies for Selenium
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install supabase selenium webdriver-manager

      - name: Run Keep Alive Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python keep_alive.py --offset ${{ matrix.offset }} --limit ${{ matrix.limit }}
